name: 🐛 Bug Report
description: Create a report to help us fix an issue or rendering defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open file '...'
        2. Click on '...'
        3. Zoom in to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: sample_svg
    attributes:
      label: Sample SVG File / Snippet
      description: Attach or paste the SVG that causes this issue (if applicable).
      render: xml
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/Arch)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SvagView Version
      description: e.g. v0.1.0 or git commit hash
      placeholder: v0.1.0
    validations:
      required: true
