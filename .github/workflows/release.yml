name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: svagview.exe
            asset_name: svagview-windows-x86_64.zip
            allow_failure: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: svagview
            asset_name: svagview-linux-x86_64.tar.gz
            allow_failure: false
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: svagview
            asset_name: svagview-macos-x86_64.tar.gz
            allow_failure: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: svagview
            asset_name: svagview-macos-aarch64.tar.gz
            allow_failure: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "svagview-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination $dir/
          Copy-Item "README.md" -Destination $dir/
          Copy-Item "LICENSE" -Destination $dir/
          Compress-Archive -Path "$dir/*" -DestinationPath "${{ matrix.asset_name }}"

      - name: Package asset (Unix)
        if: runner.os != 'Windows'
        run: |
          DIR="svagview-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$DIR/"
          cp README.md LICENSE "$DIR/"
          tar -czvf "${{ matrix.asset_name }}" -C "$DIR" .

      - name: Generate Checksum
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile "${{ matrix.asset_name }}" SHA256 | grep -v ":" | tr -d ' \r\n' > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" | awk '{print $1}' > "${{ matrix.asset_name }}.sha256"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built assets
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Flatten assets directory
        run: |
          mkdir -p dist
          find release_assets -type f -exec cp {} dist/ \;
          cd dist
          sha256sum svagview-*.* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
