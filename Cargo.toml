[package]
name = "svagview"
version = "0.1.1"
edition = "2021"
rust-version = "1.85.0"
description = "Lightweight, ultra-fast native SVG/SVGZ viewer and export tool built with Rust, Slint, and resvg"
authors = ["SvagView Contributors"]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vaibhav-upadhyay/SvagView"
keywords = ["svg", "svgz", "viewer", "vector-graphics", "slint"]
categories = ["command-line-utilities", "graphics", "gui", "visualization"]

[dependencies]
slint = "1.9"
resvg = "0.50"
tiny-skia = "0.12"
usvg = "0.50"
rfd = "0.18"
arboard = "3.7"
open = "5.3"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
