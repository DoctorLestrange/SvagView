<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#41006f" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#12131a" rx="16" />

  <text x="50" y="60" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    Complex Paths, Arcs &amp; Even-Odd Fill Rule
  </text>

  <!-- Self-intersecting star / polygon with fill-rule="evenodd" -->
  <g transform="translate(180, 220)">
    <polygon points="0,-120 70,100 -110,-40 110,-40 -70,100" fill="url(#gold-grad)" stroke="#ffffff" stroke-width="3" fill-rule="evenodd" />
    <circle cx="0" cy="0" r="16" fill="#12131a" stroke="#ffe259" stroke-width="2" />
  </g>

  <!-- Complex parametric flower / gears using cubic and quadratic beziers -->
  <g transform="translate(560, 220)">
    <path d="M 0,-100
             C 40,-100 40,-60 80,-60
             C 120,-60 100,-20 120,0
             C 100,20 120,60 80,60
             C 40,60 40,100 0,100
             C -40,100 -40,60 -80,60
             C -120,60 -100,20 -120,0
             C -100,-20 -120,-60 -80,-60
             C -40,-60 -40,-100 0,-100 Z"
          fill="url(#violet-glow)" stroke="#00f2fe" stroke-width="3" />
    <circle cx="0" cy="0" r="30" fill="#12131a" stroke="#00f2fe" stroke-width="2" />
  </g>

  <!-- Complex Spiral / Nautilus curve -->
  <g transform="translate(400, 460)">
    <path d="M 0,0
             A 10,10 0 0,1 10,10
             A 20,20 0 0,1 -10,30
             A 40,40 0 0,1 -40,-10
             A 70,70 0 0,1 30,-50
             A 110,110 0 0,1 80,50
             A 160,160 0 0,1 -70,110"
          fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
