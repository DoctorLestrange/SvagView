<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Gaussian Blur Filter -->
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="deep-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Color Matrix / Duo-tone Filter -->
    <filter id="matrix-duotone">
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0.2
        0.33 0.33 0.33 0 0.8
        0.33 0.33 0.33 0 0.9
        0    0    0    1 0" />
    </filter>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#3a6073" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0c0e14" rx="16" />

  <text x="50" y="60" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    SVG Filters (Blur, Shadow &amp; Color Matrix)
  </text>

  <!-- Glowing neon orbs with feGaussianBlur -->
  <circle cx="180" cy="220" r="70" fill="#ff007f" filter="url(#soft-blur)" />
  <circle cx="180" cy="220" r="45" fill="#ffffff" />

  <circle cx="280" cy="250" r="60" fill="#00f2fe" filter="url(#soft-blur)" />
  <circle cx="280" cy="250" r="35" fill="#ffffff" />

  <!-- Glassmorphism / DropShadow Card -->
  <g filter="url(#deep-shadow)">
    <rect x="440" y="140" width="280" height="180" rx="16" fill="url(#card-grad)" />
    <circle cx="500" cy="200" r="28" fill="#ffffff" opacity="0.9" />
    <rect x="545" y="185" width="130" height="14" rx="7" fill="#ffffff" opacity="0.9" />
    <rect x="545" y="210" width="80" height="10" rx="5" fill="#ffffff" opacity="0.6" />
    <rect x="470" y="260" width="220" height="30" rx="8" fill="#1b2434" opacity="0.8" />
  </g>

  <!-- Filtered geometric pattern -->
  <g filter="url(#matrix-duotone)" transform="translate(100, 380)">
    <rect width="600" height="140" rx="12" fill="#202430" />
    <circle cx="80" cy="70" r="45" fill="#ff5722" />
    <rect x="180" y="30" width="80" height="80" rx="10" fill="#4caf50" />
    <polygon points="340,30 390,110 290,110" fill="#ffeb3b" />
    <text x="430" y="80" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#ffffff">
      Color Matrix Filter
    </text>
  </g>
</svg>
