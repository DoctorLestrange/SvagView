<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>

    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg-grad)" />

  <!-- App icon decorative background glow -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.04" />
  <circle cx="256" cy="256" r="140" fill="#ffffff" opacity="0.04" />

  <!-- Vector Lightning bolt & Eye emblem -->
  <path d="M 280 96 L 160 272 L 244 272 L 220 416 L 360 224 L 276 224 Z"
        fill="url(#accent-grad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

  <!-- Floating accent widgets -->
  <rect x="80" y="360" width="100" height="48" rx="14" fill="#0f2042" opacity="0.9" stroke="#38ef7d" stroke-width="2" />
  <circle cx="106" cy="384" r="10" fill="url(#emerald)" />
  <rect x="126" y="378" width="40" height="12" rx="6" fill="#ffffff" opacity="0.8" />

  <rect x="330" y="110" width="104" height="48" rx="14" fill="#0f2042" opacity="0.9" stroke="#f857a6" stroke-width="2" />
  <circle cx="356" cy="134" r="10" fill="url(#accent-grad)" />
  <rect x="376" y="128" width="42" height="12" rx="6" fill="#ffffff" opacity="0.8" />
</svg>
